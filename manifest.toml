#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "warpgate"
name = "Warpgate"
description.en = "Secure access to SSH, HTTPS, RDP, VNC, Kubernetes, PostgreSQL and MySQL"
description.fr = "Accès sécurisé à SSH, HTTPS, RDP, VNC, Kubernetes, PostgreSQL et MySQL"

version = "0.30.4~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
website = "https://warpgate.null.page/"
admindoc = "https://warpgate.null.page/docs/"
code = "https://github.com/warp-tech/warpgate"

[integration]
yunohost = ">= 12.1.40.1"
helpers_version = "2.1"
architectures = ["amd64","arm64"]
multi_instance = false

ldap = false
sso = false

disk = "10M"
ram.build = "80M"
ram.runtime = "30M"

[install]

    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.password]
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    extract = false
    rename = "warpgate"
    amd64.url = "https://github.com/warp-tech/warpgate/releases/download/v0.30.4/warpgate-v0.30.4-x86_64-linux"
    amd64.sha256 = "effb794a3b9c2d431373242a0562cbae21bd017310394b973a3f8ba8cd1f9073"

    arm64.url = "https://github.com/warp-tech/warpgate/releases/download/v0.30.4/warpgate-v0.30.4-arm64-linux"
    arm64.sha256 = "d9887ddb3fed7c6fc7b09cc8724869c6287582e74a03e6bf0bc2a4980c50acb3"
    
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^warpgate-.*-x86_64-linux$"
    autoupdate.asset.arm64 = "^warpgate-.*-arm64-linux$"
    autoupdate.upstream = "https://github.com/warp-tech/warpgate"
    
    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    ssh.exposed = "TCP"
    mysql.exposed = "TCP"
    postgres.exposed = "TCP"
    kubernetes.exposed = "TCP"
    rdp.exposed = "TCP"
    vnc.exposed = "TCP"

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
